<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minas</title>
<meta name="description" content="Quanto recebes ao entregar lingotes de prata, lingotes de cobre e areia, e quanto vale no mercado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@200;400&family=Barlow:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../craft.css">
</head>
<body>
<script src="../receitas.js"></script>
<script>
// Só dados e textos. Copiado de scripts/modelo.html, que tem todas as opções.
// O layout está em ../craft.js e ../craft.css (igual em todas as páginas).
// Não é um craft: entregas nas minas e devolvem o que sobra. As percentagens vêm de ../receitas.js (CONVERSOES),
// que também dá preço aos lingotes/areia pelo que convertem (1 lingote de cobre = 0,8 × Cobre).
window.CRAFT = {
  id: "minas",
  title: "Minas",
  short: "Minas",
  itemLabel: "Recebes",
  unit: ["entregue", "entregues"],
  qtyLabel: "Entregas",
  outTitle: "Recebes",
  fichaTitle: "Entregas",
  roundDown: true,                 // o que recebes arredonda para baixo
  matCols: false,
  valLabel: "Vale cada",           // quanto vale 1 unidade entregue = o que dá × mínimo do mercado
  note: "A quantidade é o que entregas. Ao entregar tiram uma parte: 30 % dos lingotes de prata, 20 % dos lingotes de cobre e 60 % da areia. Ex.: 10 lingotes de prata dão 7 de prata. \"Vale cada\" é quanto vale 1 unidade entregue pelo que dá: 1 lingote de cobre = 0,8 × o preço do Cobre.",
  groups: [
    { name: "Minas", items: [
      { n: "Prata", m: { "Lingote de prata": 1 }, out: CONVERSOES["Lingote de prata"]["Prata"], sub: "Tiram 30 %: 10 lingotes dão 7" },
      { n: "Cobre", m: { "Lingote de cobre": 1 }, out: CONVERSOES["Lingote de cobre"]["Cobre"], sub: "Tiram 20 %: 10 lingotes dão 8" },
      { n: "Vidro", m: { "Areia": 1 },            out: CONVERSOES["Areia"]["Vidro"], sub: "Tiram 60 %: 10 de areia dão 4" },
    ]},
  ],
};
</script>
<script src="../craft.js"></script>
</body>
</html>
