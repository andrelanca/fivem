<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ferramentas FiveM</title>
<meta name="description" content="Painel com as ferramentas do servidor FiveM: calculadora de crafting e as que vierem a seguir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@200;400&family=Barlow:wght@300;400;500&display=swap">
<style>
/* Hallmark · shape: app screen · genre: atmospheric · theme: Darkroom (deal 3/3, seed crafting-price-calculator-fivem-9103·8ad352fc·2026-11-08·r0) · redesign: full
 * nav: top bar, the hub is the home of every tool · signature: the tool sheet, each tool a full-width row with its title · states: one list · darkroom: amber
 * axes: dark/display-condensed/chromatic-amber · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H5 E4 S4 R5 V3 · weakest: V, a launcher with one tool is a short list; each row shows what is saved in it so the hub earns its place before the second tool exists */
@import url("./tokens.css");
@import url("./base.css");

:root { --bar-h: 64px; --row-hover: color-mix(in oklab, var(--color-ink) 4%, transparent); }
body { font-size: 1.0625rem; }
.shell { max-width: var(--container); margin-inline: auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.bar { border-bottom: var(--rule-hair) solid var(--color-rule); }
.bar-in { min-height: var(--bar-h); display: flex; align-items: center; gap: var(--space-lg); }
.mark { font-family: var(--font-display); font-weight: 400; font-size: var(--text-2xl); text-transform: uppercase; line-height: 1; letter-spacing: var(--tracking-display); color: var(--color-ink); text-decoration: none; }
.mark:hover { color: var(--color-ink-2); }

.head { padding-block: var(--space-2xl) var(--space-xl); display: grid; gap: var(--space-sm); }
.head h1 { font-size: clamp(3.5rem, 2rem + 6vw, 7rem); font-weight: 200; text-transform: uppercase; line-height: 1; max-width: none; }
.head p { color: var(--color-ink-2); max-width: 48ch; }

.tools { list-style: none; margin: 0 0 var(--space-3xl); padding: 0; border-top: var(--rule-hair) solid var(--color-muted); }
.tool { border-bottom: var(--rule-hair) solid var(--color-rule); }
.tool a { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-sm) var(--space-xl); padding: var(--space-lg) var(--space-sm); color: inherit; text-decoration: none; transition: background-color var(--dur-micro) var(--ease-out); }
.tool a:hover { background: var(--row-hover); }
.tool a:active { background: var(--color-paper-2); }
.tool a:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
.tool h2 { font-weight: 400; font-size: var(--text-3xl); text-transform: uppercase; max-width: none; }
.tool .go { min-height: 40px; padding: 0 var(--space-lg); border: var(--rule-hair) solid var(--color-ink); display: inline-flex; align-items: center; font: 400 var(--text-lg)/1 var(--font-display); text-transform: uppercase; white-space: nowrap; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out); }
.tool a:hover .go { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.more { color: var(--color-muted); font-size: var(--text-sm); padding: var(--space-lg) var(--space-sm); }

</style>
</head>
<body>
<header class="bar">
  <div class="shell bar-in">
    <a class="mark" href="./" aria-label="Ferramentas FiveM, início">FiveM</a>
  </div>
</header>
<main class="shell">
  <div class="head">
    <h1>Ferramentas</h1>
    <p>As ferramentas do servidor num só sítio. O que guardas em cada uma fica neste browser.</p>
  </div>
  <ul class="tools" id="tools">
    <li class="tool">
      <a href="crafting/" data-tool="crafting">
        <h2>Craft de Acessórios</h2>
        <span class="go">Abrir</span>
      </a>
    </li>
  </ul>
  <p class="more">Novas ferramentas aparecem nesta lista.</p>
</main>
</body>
</html>
