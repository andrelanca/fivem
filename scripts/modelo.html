<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITULO__</title>
<meta name="description" content="__DESCRICAO__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@200;400&family=Barlow:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../craft.css">
</head>
<body>
<script>
// Só dados e textos. O layout está em ../craft.js e ../craft.css (igual em todas as páginas).
window.CRAFT = {
  id: "__PASTA__",              // chave onde o browser guarda as quantidades
  title: "__TITULO__",
  short: "__CURTO__",           // nome grande no topo
  itemLabel: "Item",            // cabeçalho da 1.ª coluna
  // Opcionais (tira o // para usar):
  // unit: ["craft", "crafts"],  // o que a quantidade conta
  // out: 2,                     // quanto sai por craft (também dá para pôr em cada item)
  // outTitle: "Recebes",        // título da lista de resultados na ficha
  // outWord: "unidades",        // palavra usada ao copiar ("= 4 unidades")
  // money: "Dinheiro",          // nome da coluna do preço
  // note: "Texto por baixo da tabela.",
  // tabs: true,                 // separadores por grupo (liga sozinho com 2+ grupos)
  // matCols: true,              // uma coluna por material (liga sozinho até 4 materiais)
  // materials: ["A", "B"],      // ordem dos materiais (por omissão, a ordem em que aparecem)
  groups: [
    { name: "Grupo", items: [
      // n: nome · m: materiais por craft · p: dinheiro por craft · out: quanto sai (opcional) · sub: texto pequeno (opcional)
      { n: "Exemplo", m: { "Material A": 1, "Material B": 2 }, p: 1000 },
    ]},
  ],
};
</script>
<script src="../craft.js"></script>
</body>
</html>
