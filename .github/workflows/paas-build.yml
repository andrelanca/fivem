# paas-build — builds this app's image(s) for linux/arm64 on GitHub Actions and
# pushes them to GHCR. The Pi builds NOTHING: the PaaS poller sees this workflow
# finish green on `main` and tells Dokploy to pull `:latest`.
#
# Why: a build on the Pi runs on a USB stick and starves every other app on the
# box (Home Assistant included) for as long as it lasts — ~30 min for a cold
# npm-heavy build. Here it is a few minutes, with layer cache, and the Pi only
# downloads the result.
#
# Copy to `.github/workflows/paas-build.yml`. Keep the file name: the poller
# looks for exactly this workflow. One `matrix.include` entry per image:
#
#   single-container app   svc: ""        -> ghcr.io/<owner>/<repo>:latest
#                          (the default below; nothing to edit)
#   compose stack          svc: <service> -> ghcr.io/<owner>/<repo>-<service>:latest
#                          one entry per service with its own code, and in the
#                          compose file that service has
#                              image: ghcr.io/<owner>/<repo>-<service>:latest
#                              pull_policy: always
#                          and NO `build:` (Dokploy runs `up --build`, so a
#                          `build:` there would build on the Pi again).
#                          Datastores (postgres:16-alpine, …) need no entry.
#
# `file` is relative to the repo root, not to `context`.
# Owner and repo are lowercased (GHCR requires it).
name: paas-build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: paas-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image ${{ matrix.svc || 'app' }} (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - svc: ""
            context: .
            dockerfile: Dockerfile
          # compose stack example (delete the entry above):
          # - svc: web
          #   context: ./web
          #   dockerfile: web/Dockerfile
          # - svc: api
          #   context: ./api
          #   dockerfile: api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: name
        env:
          SVC: ${{ matrix.svc }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}${SVC:+-$SVC}" >> "$GITHUB_OUTPUT"
      # QEMU runs only the arm64 stages. Mark build stages whose output is
      # architecture-independent (static files, transpiled JS) with
      # `FROM --platform=$BUILDPLATFORM` and they run natively, much faster.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.svc || 'app' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc || 'app' }}
